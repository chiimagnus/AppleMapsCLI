name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.runner }} (Swift)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Select Xcode 26 on macOS 15
        if: matrix.runner == 'macos-15-intel'
        shell: bash
        run: |
          set -euo pipefail
          xcode=""
          for candidate in /Applications/Xcode_26.*.app/Contents/Developer; do
            if test -d "$candidate"; then xcode="$candidate"; fi
          done
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          xcodebuild -version
          swift test --disable-automatic-resolution
